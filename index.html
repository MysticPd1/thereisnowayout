<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERE IS NO WAY OUT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000;color:#e8e8e8;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    overflow:hidden;height:100vh;
    cursor:crosshair;
  }

  /* === TV STATIC NOISE (canvas behind everything) === */
  #noise{
    position:fixed;inset:0;width:100%;height:100%;
    opacity:0.06;z-index:1;pointer-events:none;
    image-rendering:pixelated;
  }

  /* === CRT SCANLINES === */
  .scanlines{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,transparent,transparent 2px,
      rgba(0,0,0,0.18) 2px,rgba(0,0,0,0.18) 4px
    );
  }

  /* === VHS TRACKING BAR === */
  .tracking{
    position:fixed;left:0;right:0;height:6px;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,0.04),transparent);
    z-index:2;pointer-events:none;
    animation:trackSlide 8s linear infinite;
  }
  @keyframes trackSlide{
    0%{top:-6px}
    100%{top:100vh}
  }

  /* === VIGNETTE === */
  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at center,
      transparent 40%,rgba(0,0,0,0.55) 75%,rgba(0,0,0,0.95) 100%
    );
  }

  /* === SCREEN FLICKER === */
  .flicker{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,93%,95%,97%,100%{opacity:0}
    94%{opacity:0.025;background:#fff}
    96%{opacity:0.015;background:#fff}
  }

  /* === CONTENT LAYER === */
  .content{
    position:relative;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;padding:20px;
  }

  /* === EYES === */
  .eyes{
    display:flex;gap:50px;margin-bottom:55px;
    opacity:0;animation:fadeIn 2.5s ease-out 0.8s forwards;
  }
  .eye{
    width:130px;height:62px;
    background:radial-gradient(ellipse at center,#f0f0f0 60%,#ccc 100%);
    border-radius:50%;position:relative;
    box-shadow:0 0 50px rgba(255,255,255,0.1),0 0 100px rgba(255,255,255,0.05);
    overflow:hidden;
    animation:blink 5s ease-in-out infinite;
  }
  .eye:nth-child(2){animation-delay:0.06s;}

  @keyframes blink{
    0%,94%,100%{transform:scaleY(1)}
    96%{transform:scaleY(0.04)}
    98%{transform:scaleY(1)}
  }

  /* iris + pupil */
  .iris{
    width:36px;height:36px;
    background:radial-gradient(circle at 40% 40%,#555 0%,#222 50%,#000 70%);
    border-radius:50%;position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    transition:transform 0.08s ease-out;
  }
  .iris::after{
    content:'';position:absolute;
    width:14px;height:14px;
    background:#000;border-radius:50%;
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  /* light reflection */
  .iris::before{
    content:'';position:absolute;
    width:7px;height:7px;
    background:rgba(255,255,255,0.8);
    border-radius:50%;
    top:8px;right:8px;z-index:1;
  }

  /* === TITLE === */
  .title{
    font-size:clamp(28px,7.5vw,76px);
    font-weight:900;letter-spacing:clamp(4px,1.5vw,12px);
    text-transform:uppercase;text-align:center;
    color:#e8e8e8;position:relative;
    opacity:0;animation:glitchIn 0.6s ease-out 2.8s forwards;
    margin-bottom:48px;line-height:1.15;
  }
  /* chromatic aberration glitch layers */
  .title::before,.title::after{
    content:attr(data-text);
    position:absolute;inset:0;overflow:hidden;
    pointer-events:none;
  }
  .title::before{
    text-shadow:2px 0 rgba(255,0,0,0.4);
    animation:glitch1 4s infinite linear alternate-reverse;
    clip-path:inset(0 0 85% 0);
  }
  .title::after{
    text-shadow:-2px 0 rgba(0,100,255,0.35);
    animation:glitch2 3.5s infinite linear alternate-reverse;
    clip-path:inset(85% 0 0 0);
  }
  @keyframes glitch1{
    0%,87%{clip-path:inset(0 0 85% 0);transform:translate(0)}
    88%{clip-path:inset(15% 0 45% 0);transform:translate(-4px,0)}
    90%{clip-path:inset(55% 0 15% 0);transform:translate(3px,0)}
    92%{clip-path:inset(0 0 85% 0);transform:translate(0)}
    94%{clip-path:inset(35% 0 35% 0);transform:translate(-2px,0)}
    96%,100%{clip-path:inset(0 0 85% 0);transform:translate(0)}
  }
  @keyframes glitch2{
    0%,90%{clip-path:inset(85% 0 0 0);transform:translate(0)}
    91%{clip-path:inset(45% 0 25% 0);transform:translate(3px,0)}
    93%{clip-path:inset(8% 0 65% 0);transform:translate(-3px,0)}
    95%,100%{clip-path:inset(85% 0 0 0);transform:translate(0)}
  }
  @keyframes glitchIn{
    0%{opacity:0;transform:scale(1.08);filter:blur(6px) brightness(3)}
    15%{opacity:1;transform:translate(-6px,3px) skewX(-2deg);filter:brightness(1.5)}
    30%{transform:translate(4px,-2px) skewX(1deg);filter:brightness(0.8)}
    50%{transform:translate(-2px,1px);filter:none}
    70%{transform:translate(1px,0)}
    100%{opacity:1;transform:translate(0);filter:none}
  }

  /* === PROMPT === */
  .prompt{
    text-align:center;
    opacity:0;animation:fadeIn 1.5s ease-out 4s forwards;
  }
  .prompt p{
    font-size:clamp(13px,2.2vw,18px);
    letter-spacing:5px;text-transform:lowercase;
    color:#666;margin-bottom:28px;font-style:italic;
  }
  .choices{display:flex;gap:50px;justify-content:center;}
  .choice{
    font-family:inherit;
    font-size:clamp(16px,2.8vw,26px);
    font-weight:700;letter-spacing:5px;text-transform:uppercase;
    background:none;
    border:1px solid rgba(255,255,255,0.25);
    color:#e8e8e8;padding:12px 34px;
    cursor:pointer;text-decoration:none;
    transition:all 0.3s;
  }
  .choice:hover{
    border-color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.5);
    box-shadow:0 0 25px rgba(255,255,255,0.08);
  }
  .choice.no{border:1px solid rgba(255,255,255,0.25);}
  .choice.no:hover{
    border-color:rgba(255,60,60,0.5);
    color:rgba(255,60,60,0.8);
    text-shadow:0 0 12px rgba(255,40,40,0.4);
  }

  /* === BLACKOUT (when they click NO) === */
  .blackout{
    position:fixed;inset:0;z-index:20;
    background:#000;
    opacity:0;pointer-events:none;
    transition:opacity 0.3s;
  }
  .blackout.active{opacity:1;pointer-events:all;cursor:default;}

  /* === GLOBAL FADE-IN === */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* === MOBILE === */
  @media(max-width:600px){
    .eyes{gap:28px;margin-bottom:36px}
    .eye{width:86px;height:42px}
    .iris{width:24px;height:24px}
    .iris::after{width:10px;height:10px}
    .iris::before{width:5px;height:5px;top:5px;right:5px}
    .title{letter-spacing:3px}
    .choices{gap:28px}
    .choice{padding:10px 22px;letter-spacing:3px}
  }
</style>
</head>
<body>

  <canvas id="noise"></canvas>
  <div class="scanlines"></div>
  <div class="tracking"></div>
  <div class="vignette"></div>
  <div class="flicker"></div>

  <div class="content" id="content">
    <div class="eyes" id="eyes">
      <div class="eye" id="eyeL"><div class="iris" id="irisL"></div></div>
      <div class="eye" id="eyeR"><div class="iris" id="irisR"></div></div>
    </div>
    <h1 class="title" data-text="THERE IS NO WAY OUT">THERE IS NO WAY OUT</h1>
    <div class="prompt">
      <p>will you enter?</p>
      <div class="choices">
        <a class="choice yes" href="hub.html" id="yesBtn">YES</a>
        <button class="choice no" id="noBtn">NO</button>
      </div>
    </div>
  </div>

  <div class="blackout" id="blackout"></div>

<script>
  /* === TV STATIC === */
  const cv = document.getElementById('noise');
  const cx = cv.getContext('2d');
  let W = cv.width = Math.ceil(window.innerWidth / 4);
  let H = cv.height = Math.ceil(window.innerHeight / 4);

  function drawNoise(){
    const img = cx.createImageData(W, H);
    const d = img.data;
    for(let i = 0; i < d.length; i += 4){
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    cx.putImageData(img, 0, 0);
    requestAnimationFrame(drawNoise);
  }
  drawNoise();
  window.addEventListener('resize', () => {
    W = cv.width = Math.ceil(window.innerWidth / 4);
    H = cv.height = Math.ceil(window.innerHeight / 4);
  });

  /* === EYE TRACKING === */
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const irisL = document.getElementById('irisL');
  const irisR = document.getElementById('irisR');

  function moveIris(eye, iris, mx, my){
    const r = eye.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = mx - cx, dy = my - cy;
    const a = Math.atan2(dy, dx);
    const dist = Math.min(1, Math.sqrt(dx*dx + dy*dy) / 300);
    const px = Math.cos(a) * r.width * 0.18 * dist;
    const py = Math.sin(a) * r.height * 0.14 * dist;
    iris.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
  }

  document.addEventListener('mousemove', e => {
    moveIris(eyeL, irisL, e.clientX, e.clientY);
    moveIris(eyeR, irisR, e.clientX, e.clientY);
  });
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    moveIris(eyeL, irisL, t.clientX, t.clientY);
    moveIris(eyeR, irisR, t.clientX, t.clientY);
  }, {passive:true});

  /* === NO BUTTON — just black. nothing. === */
  const noBtn = document.getElementById('noBtn');
  const blackout = document.getElementById('blackout');

  noBtn.addEventListener('click', () => {
    blackout.classList.add('active');
  });

  /* === YES BUTTON === */
  document.getElementById('yesBtn').addEventListener('click', e => {
    e.preventDefault();
    /* brief static burst then fade out */
    cv.style.opacity = '0.3';
    cv.style.transition = 'opacity 0.15s';
    setTimeout(() => {
      content.style.transition = 'opacity 0.4s';
      content.style.opacity = '0';
      cv.style.opacity = '0';
    }, 150);
    setTimeout(() => { window.location.href = 'hub.html'; }, 600);
  });
</script>
</body>
</html>
