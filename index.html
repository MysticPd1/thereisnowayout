<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERE IS NO WAY OUT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000;color:#e8e8e8;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    overflow:hidden;height:100vh;
    cursor:crosshair;
  }

  /* === TV STATIC NOISE (canvas behind everything) === */
  #noise{
    position:fixed;inset:0;width:100%;height:100%;
    opacity:0.05;z-index:1;pointer-events:none;
    image-rendering:pixelated;
  }

  /* === CRT SCANLINES === */
  .scanlines{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,transparent,transparent 2px,
      rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px
    );
  }

  /* === VHS TRACKING BAR === */
  .tracking{
    position:fixed;left:0;right:0;height:6px;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,0.04),transparent);
    z-index:6;pointer-events:none;
    animation:trackSlide 8s linear infinite;
  }
  @keyframes trackSlide{
    0%{top:-6px}
    100%{top:100vh}
  }

  /* === VIGNETTE === */
  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at center,
      transparent 30%,rgba(0,0,0,0.5) 65%,rgba(0,0,0,0.95) 100%
    );
  }

  /* === SCREEN FLICKER === */
  .flicker{
    position:fixed;inset:0;z-index:7;pointer-events:none;
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,93%,95%,97%,100%{opacity:0}
    94%{opacity:0.025;background:#fff}
    96%{opacity:0.015;background:#fff}
  }

  /* === CONTENT LAYER === */
  .content{
    position:relative;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    height:100vh;padding:20px 20px 12vh;
  }

  /* === HERO IMAGE — full bleed, no seams === */
  .hero-face{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center 30%;
    z-index:0;
    opacity:0;
    animation:faceReveal 3s ease-out 0.5s forwards;
    filter:contrast(1.15) brightness(0.9);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at center 40%,
      rgba(0,0,0,1) 20%,rgba(0,0,0,0.6) 50%,transparent 80%);
    mask-image:radial-gradient(ellipse 70% 60% at center 40%,
      rgba(0,0,0,1) 20%,rgba(0,0,0,0.6) 50%,transparent 80%);
  }
  @keyframes faceReveal{
    0%{opacity:0;filter:contrast(1.15) brightness(0) blur(8px)}
    40%{opacity:0.7;filter:contrast(1.15) brightness(0.5) blur(2px)}
    70%{opacity:0.9;filter:contrast(1.15) brightness(0.8) blur(0)}
    100%{opacity:1;filter:contrast(1.15) brightness(0.9) blur(0)}
  }

  /* === TITLE === */
  .title{
    font-size:clamp(28px,7.5vw,76px);
    font-weight:900;letter-spacing:clamp(4px,1.5vw,12px);
    text-transform:uppercase;text-align:center;
    color:#e8e8e8;position:relative;
    opacity:0;animation:glitchIn 0.6s ease-out 3s forwards;
    margin-bottom:48px;line-height:1.15;
  }
  /* chromatic aberration glitch layers */
  .title::before,.title::after{
    content:attr(data-text);
    position:absolute;inset:0;overflow:hidden;
    pointer-events:none;
  }
  .title::before{
    text-shadow:2px 0 rgba(255,0,0,0.4);
    animation:glitch1 4s infinite linear alternate-reverse;
    clip-path:inset(0 0 85% 0);
  }
  .title::after{
    text-shadow:-2px 0 rgba(0,100,255,0.35);
    animation:glitch2 3.5s infinite linear alternate-reverse;
    clip-path:inset(85% 0 0 0);
  }
  @keyframes glitch1{
    0%,87%{clip-path:inset(0 0 85% 0);transform:translate(0)}
    88%{clip-path:inset(15% 0 45% 0);transform:translate(-4px,0)}
    90%{clip-path:inset(55% 0 15% 0);transform:translate(3px,0)}
    92%{clip-path:inset(0 0 85% 0);transform:translate(0)}
    94%{clip-path:inset(35% 0 35% 0);transform:translate(-2px,0)}
    96%,100%{clip-path:inset(0 0 85% 0);transform:translate(0)}
  }
  @keyframes glitch2{
    0%,90%{clip-path:inset(85% 0 0 0);transform:translate(0)}
    91%{clip-path:inset(45% 0 25% 0);transform:translate(3px,0)}
    93%{clip-path:inset(8% 0 65% 0);transform:translate(-3px,0)}
    95%,100%{clip-path:inset(85% 0 0 0);transform:translate(0)}
  }
  @keyframes glitchIn{
    0%{opacity:0;transform:scale(1.08);filter:blur(6px) brightness(3)}
    15%{opacity:1;transform:translate(-6px,3px) skewX(-2deg);filter:brightness(1.5)}
    30%{transform:translate(4px,-2px) skewX(1deg);filter:brightness(0.8)}
    50%{transform:translate(-2px,1px);filter:none}
    70%{transform:translate(1px,0)}
    100%{opacity:1;transform:translate(0);filter:none}
  }

  /* === PROMPT === */
  .prompt{
    text-align:center;
    opacity:0;animation:fadeIn 1.5s ease-out 4.2s forwards;
  }
  .prompt p{
    font-size:clamp(13px,2.2vw,18px);
    letter-spacing:5px;text-transform:lowercase;
    color:#666;margin-bottom:28px;font-style:italic;
  }
  .choices{display:flex;gap:50px;justify-content:center;}
  .choice{
    font-family:inherit;
    font-size:clamp(16px,2.8vw,26px);
    font-weight:700;letter-spacing:5px;text-transform:uppercase;
    background:none;
    border:1px solid rgba(255,255,255,0.25);
    color:#e8e8e8;padding:12px 34px;
    cursor:pointer;text-decoration:none;
    transition:all 0.3s;
  }
  .choice:hover{
    border-color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.5);
    box-shadow:0 0 25px rgba(255,255,255,0.08);
  }
  .choice.no{border:1px solid rgba(255,255,255,0.25);}
  .choice.no:hover{
    border-color:rgba(255,60,60,0.5);
    color:rgba(255,60,60,0.8);
    text-shadow:0 0 12px rgba(255,40,40,0.4);
  }

  /* === SCREEN GLITCH (yes click) === */
  .glitch-hit{animation:glitchHit 0.4s ease-out}
  @keyframes glitchHit{
    0%{transform:translate(0);filter:none}
    15%{transform:translate(-6px,3px) skewX(-3deg);filter:brightness(2) contrast(2)}
    30%{transform:translate(5px,-2px) skewX(2deg);filter:invert(1)}
    45%{transform:translate(-3px,1px);filter:brightness(0.3)}
    60%{transform:translate(2px,-1px);filter:hue-rotate(180deg)}
    80%{transform:translate(-1px,0);filter:brightness(1.3)}
    100%{transform:translate(0);filter:none}
  }

  /* === BLACKOUT (when they click NO) === */
  .blackout{
    position:fixed;inset:0;z-index:20;
    background:#000;
    opacity:0;pointer-events:none;
    transition:opacity 0.3s;
  }
  .blackout.active{opacity:1;pointer-events:all;cursor:default;}

  /* === GLOBAL FADE-IN === */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* === MOBILE === */
  @media(max-width:600px){
    .hero-face{max-height:28vh;margin-bottom:28px}
    .title{letter-spacing:3px}
    .choices{gap:28px}
    .choice{padding:10px 22px;letter-spacing:3px}
  }
</style>
</head>
<body>

  <canvas id="noise"></canvas>
  <div class="scanlines"></div>
  <div class="tracking"></div>
  <div class="vignette"></div>
  <div class="flicker"></div>

  <img class="hero-face" src="thereisnowayout v1.png" alt="">

  <div class="content" id="content">
    <h1 class="title" data-text="THERE IS NO WAY OUT">THERE IS NO WAY OUT</h1>
    <div class="prompt">
      <p id="promptText">will you enter?</p>
      <div class="choices">
        <a class="choice yes" href="hub.html" id="yesBtn">YES</a>
        <button class="choice no" id="noBtn">NO</button>
      </div>
    </div>
  </div>

  <div class="blackout" id="blackout"></div>

<script>
  /* === TV STATIC === */
  const cv = document.getElementById('noise');
  const cx = cv.getContext('2d');
  let W = cv.width = Math.ceil(window.innerWidth / 4);
  let H = cv.height = Math.ceil(window.innerHeight / 4);

  function drawNoise(){
    const img = cx.createImageData(W, H);
    const d = img.data;
    for(let i = 0; i < d.length; i += 4){
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    cx.putImageData(img, 0, 0);
    requestAnimationFrame(drawNoise);
  }
  drawNoise();
  window.addEventListener('resize', () => {
    W = cv.width = Math.ceil(window.innerWidth / 4);
    H = cv.height = Math.ceil(window.innerHeight / 4);
  });

  /* === NO BUTTON — just black. nothing. === */
  const noBtn = document.getElementById('noBtn');
  const blackout = document.getElementById('blackout');

  noBtn.addEventListener('click', () => {
    blackout.classList.add('active');
  });

  /* === YES BUTTON — escalating confirmation === */
  const yesBtn = document.getElementById('yesBtn');
  const promptText = document.getElementById('promptText');
  const content = document.getElementById('content');
  let yesCount = 0;

  yesBtn.addEventListener('click', e => {
    e.preventDefault();
    yesCount++;

    if(yesCount === 1){
      /* first click: glitch + "are you sure?" */
      content.classList.remove('glitch-hit');
      void content.offsetWidth;
      content.classList.add('glitch-hit');
      promptText.textContent = '...are you sure?';
      return;
    }

    if(yesCount === 2){
      /* second click: harder glitch + "no going back" */
      content.classList.remove('glitch-hit');
      void content.offsetWidth;
      content.classList.add('glitch-hit');
      promptText.textContent = 'there is no going back.';
      return;
    }

    /* third click: static burst, fade, enter */
    cv.style.opacity = '0.35';
    cv.style.transition = 'opacity 0.12s';
    content.classList.remove('glitch-hit');
    void content.offsetWidth;
    content.classList.add('glitch-hit');
    setTimeout(() => {
      content.style.transition = 'opacity 0.5s';
      content.style.opacity = '0';
      cv.style.transition = 'opacity 0.4s';
      cv.style.opacity = '0';
      document.querySelector('.hero-face').style.transition = 'opacity 0.5s';
      document.querySelector('.hero-face').style.opacity = '0';
    }, 200);
    setTimeout(() => { window.location.href = 'hub.html'; }, 800);
  });
</script>
</body>
</html>
